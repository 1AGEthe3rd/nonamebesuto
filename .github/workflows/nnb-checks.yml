name: Validate NNB gym and HQ1 return
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check training.mjs
      - run: node --check venue-entry.mjs
      - run: node --test tests/training.test.mjs
