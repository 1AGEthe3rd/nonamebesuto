  trainingBag.children[0].material.emissiveIntensity = .72;
  resultText.textContent = (strike.onBeat ? 'On beat' : 'Landed') + ' · combo ' + strike.combo;

  const readout = Math.ceil(state.remaining / 1000) + 's · ' + state.score + ' points · ' + state.hits + ' hits';
  if (readout !== lastReadout) roundText.textContent = lastReadout = readout;
  if (state.complete && replay.hidden) {
    resultText.textContent = 'Round complete · ' + state.score + ' points';
    replay.hidden = false;
    for (const button of punches) button.disabled = true;
  }
}

if (studioPreview) {
  camera.position.set(3.8, 2.6, 11);
  camera.lookAt(-1.9, 1.65, -4.7);
  renderer.render(scene, camera);
}
const clock = new THREE.Clock();
if (!studioPreview) renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05);
  const focused = document.hasFocus() && !document.hidden;
  let devices = [];
  try { devices = navigator.getGamepads?.() ?? []; } catch {}
  const pad = gamepad.sample(devices, focused);
  if (round) {
    if (pad.edges.includes(4)) hit('left');
    if (pad.edges.includes(5)) hit('right');
    if (pad.edges.includes(1)) closeRound();
  } else if (pad.edges.includes(2)) interact();
  tickTraining(dt);

  if (active && focused && !round && panel.style.display !== 'block' && !renderer.xr.isPresenting) {
    const delta = 5.1 * dt;
    const x = Number(pressed.has('KeyD') || pressed.has('ArrowRight')) - Number(pressed.has('KeyA') || pressed.has('ArrowLeft')) + controls.move.x;
    const z = Number(pressed.has('KeyS') || pressed.has('ArrowDown')) - Number(pressed.has('KeyW') || pressed.has('ArrowUp')) + controls.move.y;
    const length = Math.max(1, Math.hypot(x, z));
    camera.position.x = THREE.MathUtils.clamp(camera.position.x + (Math.cos(yaw) * x + Math.sin(yaw) * z) * delta / length, -13.8, 13.8);
    camera.position.z = THREE.MathUtils.clamp(camera.position.z + (-Math.sin(yaw) * x + Math.cos(yaw) * z) * delta / length, -14.7, 14.7);
    look(controls.look.x * dt * 520, controls.look.y * dt * 520);
  }

  for (const item of interactions) item.halo.rotation.z += dt * .5;
  renderer.render(scene, camera);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (studioPreview) renderer.render(scene, camera);
});
</script></body></html>
